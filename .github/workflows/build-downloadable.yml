name: Build the downloadable JARVIS

# Produces ready-to-run folders that need no Python, no installer and no
# admin rights: download the zip from the Releases page, unzip it onto a
# flash drive, run it on any computer.
#
# Two ways to run it:
#
#   * push a version tag (v1.0.0) - builds and publishes the release
#   * start it by hand from the Actions tab - builds, and publishes too if
#     you fill in the "version" box
#
# The hand-started route exists because pushing a tag is not always possible
# (a sandboxed or restricted checkout may not be allowed to write refs/tags).
# Given a version, the release step creates the tag itself at the commit it
# just built, so the result is identical either way.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0. Leave blank to only build."
        required: false
        default: ""

permissions:
  contents: write        # needed to attach the builds to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # a broken mac build must not lose the windows one
      matrix:
        include:
          # Windows is the download. It is the platform this gets used on,
          # and the only artifact that reaches the Releases page.
          - os: windows-latest
            label: Windows
            asset: JARVIS-Downloadable-Windows
          # Linux is kept as a TEST, not a download. It is the only runner
          # where the frozen app can actually be launched and checked that it
          # stays up - Windows and macOS runners cannot do that headless.
          # Without it every build would be verified as complete but never as
          # running. It publishes no release asset.
          - os: ubuntu-latest
            label: Linux (smoke test only)
            asset: JARVIS-SmokeTest-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 because PyQt5 wheels are reliably available for it on all
          # three runners; newer versions have gaps.
          python-version: "3.11"

      - name: Install Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rocket-simulation-ui/requirements.txt
          pip install pyinstaller

      - name: Run the physics test suites
        # Never ship a build whose numbers have not been checked.
        working-directory: rocket-simulation-ui
        run: |
          python tools/validate_presets.py
          python hybrid_sim/verify.py

      - name: Build
        working-directory: rocket-simulation-ui
        run: python build_simple.py --no-prompt

      - name: Check the bundle is complete
        # PyInstaller does not fail when it leaves a module out - it just
        # ships an app that dies on the user's machine. Open the bundle and
        # confirm every module and data folder actually made it in.
        working-directory: rocket-simulation-ui
        run: python tools/check_bundle.py

      - name: Check it starts (Linux only)
        # The one runner where a real headless launch is possible. A window
        # that builds is the broadest smoke test there is.
        if: runner.os == 'Linux'
        working-directory: rocket-simulation-ui/dist/JARVIS_Rocket_Simulation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          # The log goes to the runner temp, not into the folder we are
          # about to ship.
          timeout 60 ./JARVIS_Rocket_Simulation > "$RUNNER_TEMP/launch.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/launch.log"
          # 124 is the timeout killing a healthy, still-running app. Anything
          # else means it exited on its own, which at startup means it crashed.
          if [ "$code" -ne 124 ]; then
            echo "::error::the app exited with $code instead of staying up"
            exit 1
          fi
          echo "started and stayed up"

      - name: Stage the downloadable folder
        shell: bash
        working-directory: rocket-simulation-ui
        run: |
          mkdir -p staging
          cp -r dist/JARVIS_Rocket_Simulation "staging/${{ matrix.asset }}"
          cp DOWNLOADABLE-README.md "staging/${{ matrix.asset }}/README.txt"
          # An empty data folder so it is obvious where saved work lands, and
          # so the app finds a writable folder on first run.
          mkdir -p "staging/${{ matrix.asset }}/JARVIS-Data"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rocket-simulation-ui/staging/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach builds to the release
    needs: build
    # A tag push, or a hand-started run that named a version.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Zip the Windows build
        # Only the Windows folder becomes a release asset. The Linux build is
        # a smoke test; it has already done its job by launching in its own
        # job and is not something anyone downloads.
        run: |
          cd builds
          # Only the downloadable build is published. Anything staged as a
          # smoke test is dropped here rather than zipped. Matching on the
          # name means a job has to be NAMED JARVIS-Downloadable-* to reach
          # the Releases page - the previous version carried release:true and
          # release:false matrix keys that nothing read, so the exclusion
          # rested on a literal folder name and renaming an asset would have
          # silently published it.
          for d in */; do
            name="${d%/}"
            case "$name" in
              JARVIS-Downloadable-*) ;;
              *) echo "not a download, skipping: $name"; rm -rf "$name" ;;
            esac
          done
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -qr "../${name}.zip" .)
          done
          ls -lh *.zip

      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag that triggered the run. On a
          # hand-started run it is the version that was typed in, and the
          # action creates that tag at the commit it just built.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: builds/*.zip
          body: |
            Download the zip, unzip it onto a flash drive, and run
            `JARVIS_Rocket_Simulation.exe`. No installation, no Python, no
            admin rights. Windows will warn that it does not recognise the
            program because it is not code-signed: More info -> Run anyway.

            Everything you save goes into the `JARVIS-Data` folder beside the
            program, so your rockets, motors and settings travel with the
            drive from one computer to the next.
