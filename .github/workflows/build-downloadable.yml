name: Build the downloadable JARVIS

# Produces a ready-to-run Windows folder that needs no Python, no installer
# and no admin rights: download the zip from the Releases page, unzip it onto
# a flash drive, run it.
#
# Windows only, deliberately. Nothing here builds or tests macOS or Linux.
#
# Two ways to run it:
#
#   * push a version tag (v1.0.0) - builds and publishes the release
#   * start it by hand from the Actions tab - builds, and publishes too if
#     you fill in the "version" box
#
# The hand-started route exists because pushing a tag is not always possible
# (a sandboxed or restricted checkout may not be allowed to write refs/tags).
# Given a version, the release step creates the tag itself at the commit it
# just built, so the result is identical either way.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0. Leave blank to only build."
        required: false
        default: ""

permissions:
  contents: write        # needed to attach the builds to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows only. This is the platform the app is used on, and the
          # only one built, tested or released.
          - os: windows-latest
            label: Windows
            asset: JARVIS-Downloadable-Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 because PyQt5 wheels are reliably available for it on all
          # three runners; newer versions have gaps.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rocket-simulation-ui/requirements.txt
          pip install pyinstaller

      - name: Run the physics test suites
        # Never ship a build whose numbers have not been checked.
        working-directory: rocket-simulation-ui
        run: |
          python tools/validate_presets.py
          python hybrid_sim/verify.py

      - name: Build
        working-directory: rocket-simulation-ui
        run: python build_simple.py --no-prompt

      - name: Check the bundle is complete
        # PyInstaller does not fail when it leaves a module out - it just
        # ships an app that dies on the user's machine. Open the bundle and
        # confirm every module and data folder actually made it in.
        working-directory: rocket-simulation-ui
        run: python tools/check_bundle.py

      - name: Stage the downloadable folder
        shell: bash
        working-directory: rocket-simulation-ui
        run: |
          mkdir -p staging
          cp -r dist/JARVIS_Rocket_Simulation "staging/${{ matrix.asset }}"
          cp DOWNLOADABLE-README.md "staging/${{ matrix.asset }}/README.txt"
          # An empty data folder so it is obvious where saved work lands, and
          # so the app finds a writable folder on first run.
          mkdir -p "staging/${{ matrix.asset }}/JARVIS-Data"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rocket-simulation-ui/staging/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach builds to the release
    needs: build
    # A tag push, or a hand-started run that named a version.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Zip the Windows build
        run: |
          cd builds
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -qr "../${name}.zip" .)
          done
          ls -lh *.zip

      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag that triggered the run. On a
          # hand-started run it is the version that was typed in, and the
          # action creates that tag at the commit it just built.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: builds/*.zip
          body: |
            Download the zip, unzip it onto a flash drive, and run
            `JARVIS_Rocket_Simulation.exe`. No installation, no Python, no
            admin rights. Windows will warn that it does not recognise the
            program because it is not code-signed: More info -> Run anyway.

            Everything you save goes into the `JARVIS-Data` folder beside the
            program, so your rockets, motors and settings travel with the
            drive from one computer to the next.
