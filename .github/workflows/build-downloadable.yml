name: Build the downloadable JARVIS

# Produces ready-to-run folders that need no Python, no installer and no
# admin rights: download the zip from the Releases page, unzip it onto a
# flash drive, run it on any computer.
#
# Runs on a version tag (and can be started by hand from the Actions tab).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the builds to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # a broken mac build must not lose the windows one
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: JARVIS-Downloadable-Windows
          - os: macos-latest
            label: macOS
            asset: JARVIS-Downloadable-macOS
          - os: ubuntu-latest
            label: Linux
            asset: JARVIS-Downloadable-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 because PyQt5 wheels are reliably available for it on all
          # three runners; newer versions have gaps.
          python-version: "3.11"

      - name: Install Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rocket-simulation-ui/requirements.txt
          pip install pyinstaller

      - name: Run the physics test suites
        # Never ship a build whose numbers have not been checked.
        working-directory: rocket-simulation-ui
        run: |
          python tools/validate_presets.py
          python hybrid_sim/verify.py

      - name: Build
        working-directory: rocket-simulation-ui
        run: python build_simple.py --no-prompt

      - name: Check the bundle is complete
        # PyInstaller does not fail when it leaves a module out - it just
        # ships an app that dies on the user's machine. Open the bundle and
        # confirm every module and data folder actually made it in.
        working-directory: rocket-simulation-ui
        run: python tools/check_bundle.py

      - name: Check it starts (Linux only)
        # The one runner where a real headless launch is possible. A window
        # that builds is the broadest smoke test there is.
        if: runner.os == 'Linux'
        working-directory: rocket-simulation-ui/dist/JARVIS_Rocket_Simulation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          # The log goes to the runner temp, not into the folder we are
          # about to ship.
          timeout 60 ./JARVIS_Rocket_Simulation > "$RUNNER_TEMP/launch.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/launch.log"
          # 124 is the timeout killing a healthy, still-running app. Anything
          # else means it exited on its own, which at startup means it crashed.
          if [ "$code" -ne 124 ]; then
            echo "::error::the app exited with $code instead of staying up"
            exit 1
          fi
          echo "started and stayed up"

      - name: Stage the downloadable folder
        shell: bash
        working-directory: rocket-simulation-ui
        run: |
          mkdir -p staging
          cp -r dist/JARVIS_Rocket_Simulation "staging/${{ matrix.asset }}"
          cp DOWNLOADABLE-README.md "staging/${{ matrix.asset }}/README.txt"
          # An empty data folder so it is obvious where saved work lands, and
          # so the app finds a writable folder on first run.
          mkdir -p "staging/${{ matrix.asset }}/JARVIS-Data"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rocket-simulation-ui/staging/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach builds to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Zip each platform
        run: |
          cd builds
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -qr "../${name}.zip" .)
          done
          ls -lh *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: builds/*.zip
          body: |
            Download the zip for your computer, unzip it onto a flash drive,
            and run it. No installation, no Python, no admin rights.

            Everything you save goes into the `JARVIS-Data` folder beside the
            program, so your rockets, motors and settings travel with the
            drive from one computer to the next.
